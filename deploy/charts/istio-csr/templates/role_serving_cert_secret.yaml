{{- if .Values.app.tls.servingCertificateSecretName }}
# Grants istio-csr read access to the pre-provisioned serving certificate Secret.
#
# This is a separate Role from templates/role.yaml because that one is created in
# .Values.app.certmanager.namespace, which need not be the namespace holding the
# Secret. Scoped by resourceNames to the single named Secret, so no broader Secret
# access is granted. Same shape as role_dynamic_istiod.yaml.
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    {{- include "cert-manager-istio-csr.labels" . | nindent 4 }}
  name: {{ include "cert-manager-istio-csr.name" . }}-serving-cert
  namespace: {{ .Values.app.tls.servingCertificateSecretNamespace }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["{{ .Values.app.tls.servingCertificateSecretName }}"]
  verbs: ["get"]
{{- end }}
